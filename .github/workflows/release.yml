name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Require qualified media runtime before publishing
        shell: pwsh
        run: |
          $qualification = Get-Content build/ffmpeg-qualification.json -Raw | ConvertFrom-Json
          if ($qualification.status -ne 'qualified') { throw 'Media runtime has not passed the release qualification gate.' }
      - run: dotnet restore .\BroadcastRouter.sln
      - run: dotnet build .\BroadcastRouter.sln --configuration Release --no-restore
      - run: dotnet test .\tests\BroadcastRouter.Tests\BroadcastRouter.Tests.csproj --configuration Release --no-build --filter 'Category!=KnownDefect'
      - run: .\scripts\Test-KnownDefects.ps1
      - name: Build self-contained release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\scripts\Publish-Release.ps1 -Version $version -OutputRoot .\artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BroadcastRouter-${{ github.ref_name }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.release-manifest.json
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem .\artifacts\*.zip).FullName
            (Get-ChildItem .\artifacts\*.sha256).FullName
            (Get-ChildItem .\artifacts\*.release-manifest.json).FullName
          )

          $null = gh release view $env:GITHUB_REF_NAME 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if (-not $releaseExists) {
            gh release create $env:GITHUB_REF_NAME `
              --verify-tag `
              --generate-notes `
              --title "BroadcastRouter $env:GITHUB_REF_NAME"

            if ($LASTEXITCODE -ne 0) {
              # A manual publisher may have created the release after our first
              # existence check. Continue only if that release now exists.
              $null = gh release view $env:GITHUB_REF_NAME 2>$null
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to create or locate release $env:GITHUB_REF_NAME."
              }
            }
          }

          gh release upload $env:GITHUB_REF_NAME $assets
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload release assets for $env:GITHUB_REF_NAME."
          }
