name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
      - run: dotnet restore .\BroadcastRouter.sln
      - run: dotnet build .\BroadcastRouter.sln --configuration Release --no-restore
      - uses: github/codeql-action/analyze@v4
